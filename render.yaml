# Render Blueprint for the back end (free Docker web service).
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is applied, and they are never stored in this repository.
services:
  - type: web
    name: voltride-copilot-api
    runtime: docker
    plan: free
    region: singapore          # same region as the Neon database
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ODOO_MODE
        value: live
      - key: LLM_PROVIDER
        value: gemini
      - key: COMPANY_TIMEZONE
        value: Asia/Hong_Kong
      - key: AUTH_SECRET
        generateValue: true    # random, generated by Render
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
